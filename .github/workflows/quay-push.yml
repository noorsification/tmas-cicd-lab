name: Build and Push to Quay

on:
  push:
    branches:
      - main

jobs:
  build-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t tmas-cicd-lab:${{ github.sha }} .

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Tag image
        run: |
          docker tag \
            tmas-cicd-lab:${{ github.sha }} \
            quay.io/admin1hyperzonemii/tmas-cicd-lab:${{ github.sha }}

      - name: Push image
        run: |
          docker push \
            quay.io/admin1hyperzonemii/tmas-cicd-lab:${{ github.sha }}
