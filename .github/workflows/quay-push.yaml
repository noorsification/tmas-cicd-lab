name: Build, Scan and Push

on:
  push:
    branches:
      - main

jobs:

  build-scan-push:

    runs-on: ubuntu-22.04

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      # ====================================
      # BUILD
      # ====================================

      - name: Build Docker image
        run: |
          docker build --no-cache \
            -t tmas-cicd-lab:${{ github.sha }} .


      # ====================================
      # LOGIN QUAY
      # ====================================

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}


      # ====================================
      # CI SCAN
      # Scan local Docker image
      # ====================================

      - name: TMAS CI Scan
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          version: '2'

          vulnerabilitiesScan: true
          malwareScan: true
          secretsScan: true

          artifact: docker:tmas-cicd-lab:${{ github.sha }}

          additionalArgs: --region=ap-southeast-1 --evaluatePolicy

          tmasApiKey: ${{ secrets.TMAS_API_KEY }}

          githubToken: ${{ secrets.GITHUB_TOKEN }}


      # ====================================
      # TAG
      # ====================================

      - name: Tag image
        run: |
          docker tag \
            tmas-cicd-lab:${{ github.sha }} \
            quay.io/admin1hyperzonemii/tmas-cicd-lab:${{ github.sha }}


      # ====================================
      # PUSH
      # ====================================

      - name: Push image
        run: |
          docker push \
            quay.io/admin1hyperzonemii/tmas-cicd-lab:${{ github.sha }}


      # ====================================
      # GET DIGEST
      # ====================================

      - name: Get image digest
        id: image
        run: |

          DIGEST=$(docker inspect \
            quay.io/admin1hyperzonemii/tmas-cicd-lab:${{ github.sha }} \
            --format='{{index .RepoDigests 0}}' \
            | sed 's/.*@//')

          echo "Image:"
          echo "quay.io/admin1hyperzonemii/tmas-cicd-lab@${DIGEST}"

          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"


      # ====================================
      # REGISTRY SCAN
      # Send result to Vision One
      # for Admission Control
      # ====================================

      - name: TMAS Registry Scan
        uses: trendmicro/tmas-scan-action@v3.1.3
        with:
          version: '2'

          vulnerabilitiesScan: true
          malwareScan: true
          secretsScan: true

          artifact: registry:quay.io/admin1hyperzonemii/tmas-cicd-lab@${{ steps.image.outputs.digest }}

          additionalArgs: --region=ap-southeast-1

          tmasApiKey: ${{ secrets.TMAS_API_KEY }}

          githubToken: ${{ secrets.GITHUB_TOKEN }}
